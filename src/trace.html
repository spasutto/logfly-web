<!DOCTYPE html>
<html>
<head>

  <title>Trace GPS de vol</title>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin=""></script>
    <script src='lib/Leaflet.fullscreen.js'></script>
    <link href='lib/leaflet.fullscreen.css' rel='stylesheet' />
    <link href='trace.css' rel='stylesheet' />
    <script src='lib/leaflet.hotline.js'></script>
    <script src="lib/leaflet.rotatedMarker.js"></script>
    <script src="igc.js"></script>
    <script src="elevation.js"></script>
    <script src="carto.js"></script>
    <script src="graph.js"></script>
    <script src="anatrace.js"></script>
    <!--<script src="anadifftrace.js"></script>-->
    <script src="lib/igc-xc-score.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.16.1.min.js"></script>
    <script src="lib/igc2kmz.min.js"></script>

</head>
<body>
<div id="loading">
  Chargement...
</div>

<div id="mapcont">
  <div id="map_elem"></div>
  <div id="vz" class="vz"></div>
  <div id="graphelm"></div>
</div>

<div id="formcont">
<h1>Calcul de vol</h1>
<label for="file-selector">Sélectionnez un fichier IGC : </label>
<input type="file" id="file-selector" accept=".igc" multiple><HR>
Ou placez directement le contenu du fichier IGC :
<form id="formigc" method="post" onsubmit="computeIGC(undefined, true);return false;">
<div style="max-width: 640px">
  <textarea type="text" id="igccont" style="width:100%;height:80px"></textarea><BR>
  <input type="submit" id="frmsub" style="display:none;float: right;" value="afficher">
</div>
</form>
</div>

<div id="dispmodes" class="replie">
  <div id="dispmodes_closed">
    <p class="clickable gras centre" onclick="event.stopImmediatePropagation();dispmodes.classList.toggle('replie');">+</p>
  </div>
  <div id="dispmodes_open">
    <p class="clickable gras centre souligne" onclick="event.stopImmediatePropagation();dispmodes.classList.toggle('replie');">Couleur trace :</p>
    <input type="radio" id="dmVz" name="dispmodes" value="vz" onclick="event.stopImmediatePropagation();window.dispmode=this.value;redrawFlight();" checked><label for="dmVz">vz</label><BR>
    <input type="radio" id="dmVx" name="dispmodes" value="vx" onclick="event.stopImmediatePropagation();window.dispmode=this.value;redrawFlight();"><label for="dmVx">vx</label><BR>
    <input type="radio" id="dmGR" name="dispmodes" value="GR" onclick="event.stopImmediatePropagation();window.dispmode=this.value;redrawFlight();"><label for="dmGR">finesse</label><BR>
    <input type="radio" id="dmAlt" name="dispmodes" value="alt" onclick="event.stopImmediatePropagation();window.dispmode=this.value;redrawFlight();"><label for="dmAlt">altitude</label><BR>
    <input type="radio" id="dmAltSol" name="dispmodes" value="altsol" onclick="event.stopImmediatePropagation();window.dispmode=this.value;redrawFlight();"><label for="dmAltSol">altitude sol</label><BR>
    <div id="opts_dispanalysers"></div>
    <input type="radio" id="dmNone" name="dispmodes" value="none" onclick="event.stopImmediatePropagation();window.dispmode=this.value;redrawFlight();"><label for="dmNone">aucune</label>
    <p class="clickable gras centre souligne" onclick="event.stopImmediatePropagation();dispmodes.classList.toggle('replie')">Mode altitude :</p>
    <input type="radio" id="dmGpsAlt" name="dispmodesalt" value="gps" onclick="event.stopImmediatePropagation();redrawAltData(this.value);" checked><label for="dmGpsAlt">GPS</label><BR>
    <input type="radio" id="dmBaroAlt" name="dispmodesalt" value="baro" onclick="event.stopImmediatePropagation();redrawAltData(this.value);"><label for="dmBaroAlt">Barométrique</label><BR>
  </div>
</div>

<div id="popupPolaire">
  <div id="btnClose" title="fermer le graph">X</div>
  <div id="graphPolaire"></div>
</div>

    <script src="trace.js"></script>
</body>
</html>
